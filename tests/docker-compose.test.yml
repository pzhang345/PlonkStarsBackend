name: plonkstars-test

services:
  test-db:
    image: postgres:17-alpine
    container_name: plonkstars-test-db
    environment:
      POSTGRES_USER: plonktest
      POSTGRES_PASSWORD: plonktest
      POSTGRES_DB: plonkstars_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plonktest -d plonkstars_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
