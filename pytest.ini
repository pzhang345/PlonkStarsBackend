[pytest]
pythonpath = app
testpaths = tests
# --import-mode=importlib is required: the default "prepend" mode inserts
# tests/ into sys.path when it imports tests/conftest.py, which shadows
# app/config.py with tests/config.py for every later bare `import config`
# (used throughout app/*) and breaks with a circular ImportError inside
# tests/config.py itself. importlib mode never touches sys.path for test
# collection, so bare `import config` always resolves to app/config.py.
addopts = -ra --strict-markers --import-mode=importlib
markers =
    unit: pure-logic tests with no DB or network I/O
    integration: tests that exercise the Flask app, DB, or other I/O
    slow: tests that are notably slower than the rest of the suite
